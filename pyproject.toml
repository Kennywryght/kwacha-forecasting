[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kwacha"
version = "0.1.0"
description = "MWK/USD forecasting pipeline (ingestion, preprocessing, features, models)"
requires-python = ">=3.10"
authors = [{ name = "Kenny" }]
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "requests>=2.31",
  "tenacity>=8.2",
  "yfinance>=0.2.40",
  "fredapi>=0.5",
  "wbdata>=1.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.3",
  "mypy>=1.9",
  "ipykernel",
]

[project.scripts]
kwacha-pipeline = "kwacha.pipeline:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["kwacha*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
